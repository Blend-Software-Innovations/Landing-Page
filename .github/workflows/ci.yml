name: CI

# DigitalOcean auto-deploys every push to main with no checks of its own —
# this workflow is the only gate between a push and production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pen_landing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pen_landing
      AUTH_JWT_SECRET: ci-only-jwt-secret-not-production
      AUTH_REFRESH_SECRET: ci-only-refresh-secret-not-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repo intentionally ships no lockfile (App Platform buildpack installs
      # fresh), so npm install rather than npm ci.
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
