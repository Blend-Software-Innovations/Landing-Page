services:
  - type: web
    name: pen-landing
    env: node
    plan: starter
    buildCommand: "npm install && npm run build && npx prisma generate"
    startCommand: "npx prisma migrate deploy && npx prisma db seed && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pen-landing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pen-landing-redis
          type: redis
          property: connectionString
      - key: NEXT_PUBLIC_SITE_URL
        value: ""
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: AUTH_ADMIN_EMAIL
        value: "admin@example.com"
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        value: "change_me"
        sync: false
      - key: AUTH_ALLOWLIST_ORIGINS
        value: ""
        sync: false
      - key: STRIPE_SECRET_KEY
        value: ""
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
        sync: false
      - key: TWILIO_SID
        value: ""
        sync: false
      - key: TWILIO_AUTH
        value: ""
        sync: false
      - key: TWILIO_PHONE
        value: ""
        sync: false
      - key: SENTRY_DSN
        value: ""
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: ""
        sync: false

databases:
  - name: pen-landing-db
    plan: starter
    # Render managed PostgreSQL: automatic daily backups on paid plans.
    # Free/starter tier: run scripts/backup.sh manually or schedule via cron.
    # Restore: psql $DATABASE_URL < backup.sql (after gunzip)

# Redis: distributed rate limiting across instances
# Safe to remove if running single-instance (in-memory fallback is automatic)
  - type: redis
    name: pen-landing-redis
    plan: starter
    maxmemoryPolicy: noeviction
